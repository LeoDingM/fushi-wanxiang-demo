<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>浮世万象 · 地铁预览（井槐里站 ⇄ 中央商务区站）</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #help { position: fixed; left: 8px; bottom: 6px; color: #9aa3ad; font: 11px/1.5 "PingFang SC", "Noto Sans CJK SC", sans-serif; pointer-events: none; }
  body.touch #help, body.shot #help { display: none; }
</style>
</head>
<body>
<canvas id="metro"></canvas>
<div id="help">WASD/方向键 移动 · E/空格 互动 · 1-9 选菜单 · Esc 关闭 · T 快进30分钟 · P 客流×2 · +/- 缩放 · URL: ?time=08:10&amp;start=cbd&amp;touch=1</div>
<!-- classic scripts (file:// works): kit manifest, area data, rules, actor atlases, module -->
<script src="kit_metro/kit_manifest.js"></script>
<script src="metro45.js"></script>
<script src="shared-rules/rules.data.js"></script>
<script src="js/actors_data.js"></script>
<script src="js/metro.js"></script>
<script>
(function () {
  const Q = new URLSearchParams(location.search), cv = document.getElementById("metro");
  const fit = () => { cv.width = +Q.get("w") || window.innerWidth; cv.height = +Q.get("h") || window.innerHeight; };
  fit(); window.addEventListener("resize", fit);
  if (Q.get("shot") === "1") document.body.classList.add("shot");
  const touch = Q.get("touch") === "1" || (Q.get("touch") !== "0" && ("ontouchstart" in window) && matchMedia("(pointer: coarse)").matches);
  if (touch) document.body.classList.add("touch");
  const tm = (Q.get("time") || "08:05").split(":").map(Number);
  let day; if (Q.get("day")) { const [y, m, d] = Q.get("day").split("-").map(Number); const c = FUSHI_RULES_DATA.calendar.start_date; day = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(c[0], c[1] - 1, c[2])) / 864e5); }
  const host = FushiMetro.mockHost({ min: tm[0] * 60 + (tm[1] || 0), day, money: Q.get("money") != null ? +Q.get("money") : 1500, season: Q.get("season") || "autumn" });
  const M = (window.__metro = FushiMetro.create({ canvas: cv, host, base: "", touch, zoom: +Q.get("zoom") || (Math.min(cv.width, cv.height) > 700 ? 1.5 : 1),
    onExit: (target, info) => {
      // preview only: the core would take over here (street = 井槐里路 street scene, cbd = CBD module id 'cbd')
      M.active = true;
      if (target === "street") M.stub("回到井槐里路（街景）", "这里是核心街景的接入点：game 收到 onExit('street')\n后把李默放回地铁口旁的人行道。", [{ label: "重新进站", act: () => M.enter("jinghuaili") }]);
      else M.stub(`到达 CBD 街区 · ${info.exit} 出口`, `CBD 模块（id 'cbd'）接入点：onExit('cbd', {exit:'${info.exit}'})\nA 中央公园 · B 云汇天地/臻品街 · C 天枢塔/金融城 · D 云汇体育中心`, [{ label: "返回地铁站", act: () => M.enter("cbd", { exit: info.exit, spawn: null }) }, { label: "回井槐里站", act: () => M.enter("jinghuaili") }]);
    } }));
  if (Q.get("crowd") != null) M.s.crowdMul = +Q.get("crowd");
  const start = Q.get("start") || "jinghuaili";
  M.enter(start, { exit: Q.get("exit") || "A" });
})();
</script>
</body>
</html>
