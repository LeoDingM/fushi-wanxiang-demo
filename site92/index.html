    body.touch.landscape #amenu:not(.hidden) { display: grid; grid-template-columns: 1fr 1fr; min-width: 380px; }

    body:not(.mobile) #floorbadge { left: 10px; transform: none; }

<body>

  <div id="app">

      <div id="paystack"></div>
      <div id="amenu" class="hidden"></div>
