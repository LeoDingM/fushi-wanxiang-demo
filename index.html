<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1014" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>浮世万象 Demo 验收</title>
  <style>
    :root {
      --bg: #0e1014;
      --card: #171b22;
      --line: #2a3140;
      --text: #e8e6e1;
      --muted: #8b93a3;
      --accent: #e8c07a;
      --accent-ink: #1a1408;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(1200px 500px at 50% -10%, #243044 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      line-height: 1.45;
    }
    main {
      max-width: 32rem;
      margin: 0 auto;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
    }
    header { margin-bottom: 1.75rem; }
    h1 {
      margin: 0 0 0.4rem;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }
    nav {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    a.entry, span.entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-height: 4.5rem;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--card);
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    a.entry {
      background: linear-gradient(180deg, #2a2418 0%, #1c1812 100%);
      border-color: #6d5830;
      color: var(--accent);
    }
    a.entry:active { transform: scale(0.985); }
    .label {
      font-size: 1.25rem;
      font-weight: 650;
    }
    .path {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    a.entry .path { color: #c4ae86; }
    .blurb {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.92rem;
      font-weight: 400;
      color: #d7c7a4;
      line-height: 1.4;
    }
    .badge {
      flex: none;
      align-self: center;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      padding: 0.35rem 0.55rem;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      white-space: nowrap;
    }
    a.entry.legacy {
      background: #12151b;
      border-color: #2a3140;
      color: #9aa2b1;
    }
    a.entry.legacy .path { color: #6d7482; }
    a.entry.legacy .badge {
      background: #222833;
      color: #8b93a3;
    }
    span.entry {
      color: #6d7482;
      background: #12151b;
      border-color: #222833;
    }
    span.entry .soon {
      flex: none;
      font-size: 0.85rem;
      padding: 0.35rem 0.6rem;
      border-radius: 999px;
      background: #222833;
      color: #8b93a3;
    }
    footer {
      margin-top: 1.75rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>浮世万象 Demo 验收</h1>
      <p class="lead">手机可直接点开试玩。斜 45° 版是当前主版本，正面俯视版仍可玩。</p>
    </header>
    <nav aria-label="版本入口">
      <a class="entry" href="front-view/">
        <span>
          <span class="label">正面俯视版</span>
          <span class="path">front-view/</span>
          <span class="blurb">60帧｜雨雪雾光影｜四季｜可破坏｜NPC作息｜1F-6F楼梯+天台+出租屋｜需求/房租/睡觉</span>
        </span>
        <span class="badge">已暂停更新（仍可玩）</span>
      </a>
      <a class="entry" href="iso45/">
        <span>
          <span class="label">斜45°版</span>
          <span class="path">iso45/</span>
          <span class="blurb">主版本｜地铁玻璃亭直达B1｜云麓花园·中央湖·近景淡出·办公窗灯｜24便利店｜每户亮灯·计电费</span>
        </span>
        <span class="badge">可玩</span>
      </a>
      <a class="entry legacy" href="web-demo/">
        <span>
          <span class="label">当前版 Demo</span>
          <span class="path">web-demo/</span>
        </span>
        <span class="badge">旧版（已停更）</span>
      </a>
    </nav>
    <footer>最近更新：2026-10-10 20:42</footer>
  </main>
</body>
</html>
